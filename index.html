<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060912">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FinTrack">
<meta name="description" content="Dashboard de metas financeiras — Franklin & Raissa">
<title>FinTrack — Franklin & Raissa</title>

<link rel="manifest" id="pwa-manifest">
<!-- Apple touch icon (SVG inline via canvas, set by JS) -->
<link rel="apple-touch-icon" id="apple-icon">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
  :root {
    --bg:#060912; --bg2:#0d1220; --bg3:#141b2d;
    --surface:#19233a; --surface2:#1f2d45;
    --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.12);
    --accent:#00e5b0; --accent2:#00bfff; --accent3:#7b61ff;
    --warn:#ffb347; --danger:#ff4d6d;
    --text:#e8edf7; --text2:#8a9bbf; --text3:#4a5a78;
    --card-shadow:0 4px 32px rgba(0,0,0,0.5);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;top:-50%;left:-20%;width:60vw;height:60vw;background:radial-gradient(circle,rgba(0,229,176,0.04) 0%,transparent 70%);pointer-events:none;z-index:0}
  body::after{content:'';position:fixed;bottom:-20%;right:-20%;width:50vw;height:50vw;background:radial-gradient(circle,rgba(123,97,255,0.05) 0%,transparent 70%);pointer-events:none;z-index:0}

  .app{width:100%;max-width:430px;margin:0 auto;padding:0 0 130px;position:relative;z-index:1}

  /* HEADER */
  .header{padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between}
  .logo{font-family:'Syne',sans-serif;font-size:1.25rem;font-weight:800;letter-spacing:-0.5px}
  .logo span{color:var(--accent)}
  .header-actions{display:flex;gap:8px}
  .icon-btn{width:40px;height:40px;background:var(--surface);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:1.1rem;transition:all 0.2s}
  .icon-btn:active{transform:scale(0.92);background:var(--surface2)}

  /* TABS */
  .tabs{display:flex;gap:5px;margin:16px 20px 0;background:var(--surface);border-radius:16px;padding:5px;border:1px solid var(--border)}
  .tab{flex:1;padding:9px 4px;border-radius:12px;border:none;background:transparent;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:0.73rem;font-weight:600;cursor:pointer;transition:all 0.2s;text-align:center}
  .tab.active{background:var(--surface2);color:var(--accent);border:1px solid rgba(0,229,176,0.2)}

  /* PANELS */
  .panel{display:none}
  .panel.active{display:block}

  /* HERO */
  .hero{margin:16px 20px 0;background:linear-gradient(135deg,#0f1e38 0%,#0d1628 50%,#0a1422 100%);border:1px solid var(--border2);border-radius:24px;padding:24px 22px;position:relative;overflow:hidden;box-shadow:var(--card-shadow)}
  .hero::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:radial-gradient(circle,rgba(0,229,176,0.18) 0%,transparent 70%)}
  .hero-label{font-size:0.7rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:4px}
  .hero-value{font-family:'Syne',sans-serif;font-size:2.4rem;font-weight:800;line-height:1;background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
  .hero-sub{font-size:0.76rem;color:var(--text2)}
  .hero-pill{display:inline-flex;align-items:center;gap:4px;background:rgba(0,229,176,0.12);border:1px solid rgba(0,229,176,0.2);color:var(--accent);font-size:0.7rem;font-weight:600;padding:4px 10px;border-radius:999px;margin-top:10px}
  .hero-pill .dot{width:6px;height:6px;background:var(--accent);border-radius:50%;animation:pulse-dot 2s infinite}
  @keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.7)}}

  /* KPI */
  .kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 20px 0}
  .kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px 16px}
  .kpi-card .lbl{font-size:0.66rem;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:4px}
  .kpi-card .val{font-family:'Syne',sans-serif;font-size:1.15rem;font-weight:700}
  .kpi-card .val.green{color:var(--accent)}
  .kpi-card .val.blue{color:var(--accent2)}

  /* ALERTS */
  .alerts{margin:10px 20px 0;display:flex;flex-direction:column;gap:6px}
  .alert{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;font-size:0.77rem;font-weight:500;animation:slideIn 0.3s ease}
  @keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
  .alert.warn{background:rgba(255,179,71,0.1);border:1px solid rgba(255,179,71,0.25);color:var(--warn)}
  .alert.danger{background:rgba(255,77,109,0.1);border:1px solid rgba(255,77,109,0.25);color:var(--danger)}
  .alert .icon{font-size:1rem;flex-shrink:0}

  /* SECTION */
  .section{margin:18px 20px 0}
  .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .section-title{font-family:'Syne',sans-serif;font-size:0.82rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text2)}
  .section-action{font-size:0.74rem;color:var(--accent);cursor:pointer;font-weight:600}

  /* COUNTDOWN */
  .countdown-card{background:linear-gradient(135deg,#1a1635 0%,#141228 100%);border:1px solid rgba(123,97,255,0.2);border-radius:20px;padding:20px;position:relative;overflow:hidden}
  .countdown-card::before{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;background:radial-gradient(circle,rgba(123,97,255,0.2) 0%,transparent 70%)}
  .countdown-top{display:flex;align-items:flex-start;justify-content:space-between}
  .countdown-label{font-size:0.68rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:6px}
  .countdown-title{font-family:'Syne',sans-serif;font-size:0.95rem;font-weight:700;color:var(--text)}
  .countdown-days{text-align:right;font-family:'Syne',sans-serif;font-size:2.4rem;font-weight:800;color:var(--accent3);line-height:1}
  .countdown-days span{display:block;font-size:0.67rem;font-weight:400;color:var(--text3);text-transform:uppercase;letter-spacing:1px;font-family:'DM Sans',sans-serif}
  .countdown-bar-bg{background:rgba(255,255,255,0.06);border-radius:999px;height:5px;overflow:hidden;margin-top:14px}
  .countdown-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent3),var(--accent2));transition:width 0.6s ease}
  .countdown-meta{display:flex;justify-content:space-between;margin-top:6px;font-size:0.67rem;color:var(--text3)}

  /* ACCOUNTS */
  .accounts{display:flex;flex-direction:column;gap:8px}
  .account-card{background:var(--surface
